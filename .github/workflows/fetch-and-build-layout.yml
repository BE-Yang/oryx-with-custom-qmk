name: Fetch and build layout

on:
  workflow_dispatch:
    inputs:
      layout_id:
        description: "Layout id from https://configure.zsa.io/voyager/layouts/[ID]/latest"
        required: true
        default: "aWZZb"
      layout_geometry:
        description: "Keyboard type"
        type: choice
        options:
          - voyager
          - moonlander
          - ergodox_ez/m32u4/glow
          - ergodox_ez/m32u4/shine
          - ergodox_ez/stm32/glow
          - ergodox_ez/stm32/shine
          - planck_ez/glow
          - planck_ez
        default: ergodox_ez/m32u4/glow

permissions:
  contents: write

jobs:
  fetch-and-build-layout:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout this repo on `oryx` branch
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: oryx
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download full history
        run: git pull --unshallow || true

      # 2. Fetch layout metadata and source from Oryx
      - name: Download layout source
        id: download-layout-source
        run: |
          response=$(curl --location 'https://oryx.zsa.io/graphql' \
            --header 'Content-Type: application/json' \
            --data '{
              "query":"query getLayout($hashId: String!, $revisionId: String!, $geometry: String) {layout(hashId: $hashId, geometry: $geometry, revisionId: $revisionId) {  revision { hashId, qmkVersion, title }}}",
              "variables":{"hashId":"${{ github.event.inputs.layout_id }}","geometry":"${{ github.event.inputs.layout_geometry }}","revisionId":"latest"}
            }' | jq '.data.layout.revision | [.hashId, .qmkVersion, .title]')

          hash_id=$(echo "${response}" | jq -r '.[0]')
          firmware_version=$(printf "%.0f" $(echo "${response}" | jq -r '.[1]'))
          change_description=$(echo "${response}" | jq -r '.[2]')

          if [[ -z "${change_description}" ]]; then
            change_description="latest layout modification made with Oryx"
          fi

          echo "hash_id=${hash_id}"
          echo "firmware_version=${firmware_version}"
          echo "change_description=${change_description}"

          curl -L "https://oryx.zsa.io/source/${hash_id}" -o source.zip

          echo "firmware_version=${firmware_version}" >> "$GITHUB_OUTPUT"
          echo "change_description=${change_description}" >> "$GITHUB_OUTPUT"

      - name: Unzip Oryx source
        run: |
          mkdir -p layouts/${{ github.event.inputs.layout_id }}
          unzip -oj source.zip '*_source/*' -d layouts/${{ github.event.inputs.layout_id }}
          rm source.zip

      - name: Commit and push Oryx updates
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "github-actions@github.com"
          git add .
          git commit -m "✨(oryx): ${{ steps.download-layout-source.outputs.change_description }}" || echo "No layout change"
          git push

      # 3. Merge `oryx` into `main`
      - name: Merge Oryx into main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git merge -Xignore-all-space oryx
          git push

      # 4. Ensure qmk_firmware submodule is on your fork, firmware25
      - name: Update QMK firmware submodule to firmware25
        run: |
          if [ -d "qmk_firmware" ]; then
            git submodule deinit -f qmk_firmware || true
            rm -rf .git/modules/qmk_firmware
            rm -rf qmk_firmware
          fi

          # This assumes .gitmodules points to https://github.com/BE-Yang/qmk_firmware.git
          git submodule update --init --remote

          cd qmk_firmware
          git fetch origin
          git checkout firmware25
          git submodule sync --recursive
          git submodule update --init --recursive
          cd ..

          git add qmk_firmware
          git commit -m "✨(qmk): Update to firmware25" || echo "No QMK change"
          git push

      # 5. Build QMK docker image (from repo's Dockerfile)
      - name: Build qmk docker image
        run: docker build -t qmk .

      # 6. Build the layout for ErgoDox EZ Glow
      - name: Build the layout
        id: build-layout
        run: |
          # Set keyboard directory and make prefix based on firmware version
          if [ "${{ steps.download-layout-source.outputs.firmware_version }}" -ge 24 ]; then
            keyboard_directory="qmk_firmware/keyboards/zsa"
            make_prefix="zsa/"
          else
            keyboard_directory="qmk_firmware/keyboards"
            make_prefix=""
          fi
      
          # Copy layout files to the qmk folder
          rm -rf ${keyboard_directory}/${{ github.event.inputs.layout_geometry }}/keymaps/${{ github.event.inputs.layout_id }}
          mkdir -p ${keyboard_directory}/${{ github.event.inputs.layout_geometry }}/keymaps
          cp -r "./${{ github.event.inputs.layout_id }}/." \
            "${keyboard_directory}/${{ github.event.inputs.layout_geometry }}/keymaps/${{ github.event.inputs.layout_id }}/"
      
          # Build the layout
          docker run -v ./qmk_firmware:/root --rm qmk /bin/sh -c "
            set -x
            cd /root
            make ${make_prefix}${{ github.event.inputs.layout_geometry }}:${{ github.event.inputs.layout_id }}
          "
      
          # Figure out the output filename (this matches what the template uses)
          keyboard_target=\"$(basename \"${{ github.event.inputs.layout_geometry }}\")\"  # glow
          normalized_layout_geometry=\"ergodox_ez_${keyboard_target}\"
          layout_id=\"${{ github.event.inputs.layout_id }}\"
          built_file=\"${normalized_layout_geometry}_${layout_id}.hex\"
      
          echo \"built_layout_file=${built_file}\" >> \"$GITHUB_OUTPUT\"
          echo \"normalized_layout_geometry=${normalized_layout_geometry}\" >> \"$GITHUB_OUTPUT\"

      # 7. Upload the .hex
      - name: Upload layout
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-layout.outputs.normalized_layout_geometry }}_${{ github.event.inputs.layout_id }}
          path: ${{ steps.build-layout.outputs.built_layout_file }}
